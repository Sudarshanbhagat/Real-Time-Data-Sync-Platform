[tool.poetry]
name = "realtime-sync-platform"
version = "0.1.0"
description = "Real-time data synchronization platform for enterprise systems (Salesforce, HubSpot, Stripe)."
authors = ["Your Name <you@example.com>"]
readme = "README.md"
# This is an application, not a library: Poetry only manages dependencies.
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = ">=0.115.0,<1.0.0"
uvicorn = { version = ">=0.32.0", extras = ["standard"] }
sqlalchemy = { version = "^2.0.36", extras = ["asyncio"] }
asyncpg = ">=0.30.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
python-dotenv = "^1.0.1"
aiokafka = ">=0.12.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"
httpx = ">=0.27.0"
aiosqlite = ">=0.20.0"
ruff = ">=0.7.0"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "kafka: needs the Kafka broker from docker-compose (auto-skipped if unreachable)",
    "jaeger: needs Jaeger from `docker compose --profile monitoring` (auto-skipped)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# aiokafka ships no type information (no py.typed).
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true
